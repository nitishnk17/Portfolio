name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check JavaScript
        run: |
          for f in script.js chatbot.js chatbot-knowledge.js server.js api/chat.js; do
            node --check "$f"
          done
      - name: Fail if an API key is committed
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules 'AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,}' .; then
            echo "API key found in repository files"; exit 1
          fi
      - name: Check local assets referenced by index.html exist
        run: |
          for f in $(grep -oE '(src|href)="[^"#:?]+\.(js|css|pdf)' index.html | sed -E 's/.*"//'); do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
